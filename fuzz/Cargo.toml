[package]
name = "virtual_camera-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
opencv = { version = "0.101", default-features = false, features = ["imgcodecs"] }
virtual_camera = { path = ".." }

[[bin]]
name = "seeds"
path = "seeds.rs"

[[bin]]
name = "smoke"
path = "fuzz_targets/smoke.rs"

[[bin]]
name = "decode_image"
path = "fuzz_targets/decode_image.rs"
