[package]
name = "virtual_camera"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[dependencies]
roslibrust = { version = "0.26", features = ["rosbridge", "codegen"] }
roslibrust_codegen_macro = "0.26"
tokio = { version = "1.38", features = ["full"] }
tokio-stream = "0.1"
opencv = { version = "0.101", default-features = false, features = ["imgcodecs", "videoio", "highgui", "imgproc"] }
log = "0.4"
env_logger = "0.11"
clap = { version = "4.5", features = ["derive"] }

[dev-dependencies]
tokio-test = "0.4"

[[bin]]
name = "virtual_camera"
path = "src/bin/virtual_camera.rs"

[[bin]]
name = "image_viewer"
path = "src/bin/image_viewer.rs"
